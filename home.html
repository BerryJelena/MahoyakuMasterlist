<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Translations</title>
  <meta name="description" content="A fan-made translations (probably mostly MHYK related)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="palette.css">
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 20px 100px;
    }

    header#masthead {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 0 40px;
      text-align: center;
      border-bottom: 1px solid var(--line-color);
    }

    #masthead h1 {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: var(--text-dark);
    }

    #masthead p {
      font-family: var(--font-ui);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0;
    }

    #feed-columns {
      max-width: 1180px;
      margin: 0 auto;
      padding-top: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
    }

    @media (max-width: 820px) {
      #feed-columns {
        grid-template-columns: 1fr;
        gap: 56px;
      }
    }

    .feed-column-heading {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-dark);
      margin: 0 0 28px 0;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-color);
    }

    .feed-column {
      display: flex;
      flex-direction: column;
      gap: 56px;
    }

    .post-card {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .post-cover-wrap {
      position: relative;
      background-color: var(--bg-panel);
      padding: 10px 10px 22px;
      box-shadow: 0 3px 10px rgba(58, 50, 41, 0.10);
      transform: rotate(var(--tilt, -0.6deg));
      margin-bottom: 22px;
    }

    /* alternate the tilt direction per card for a scattered-photo feel */
    .post-card:nth-child(even) .post-cover-wrap { --tilt: 0.6deg; }

    .post-cover {
      width: 100%;
      display: block;
      height: auto;
      background-color: #e8ddc4;
    }

    .post-meta {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 8px 0;
    }

    .post-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 12px 0;
      color: var(--text-dark);
    }

    .post-card:hover .post-title { color: var(--accent); }

    .post-excerpt {
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-dark);
      margin: 0 0 12px 0;
    }

    .read-more {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.85rem;
      padding: 60px 0;
    }
    .status-msg.error { color: var(--accent); }
  </style>
</head>
<body>

  <header id="masthead">
    <h1>Mahoyaku Translations</h1>
    <p>A fan-run archive of event &amp; and maybe card story translations</p>
  </header>

  <div id="feed-status" class="status-msg">Loading stories&hellip;</div>

  <div id="feed-columns" style="display:none;">
    <section>
      <h2 class="feed-column-heading">Event Translations</h2>
      <div id="feed-events" class="feed-column"></div>
    </section>
    <section>
      <h2 class="feed-column-heading">Card Translations</h2>
      <div id="feed-cards" class="feed-column"></div>
    </section>
  </div>

  <script>
    /* ============================================================
       CONFIG
       ============================================================
       1. SPREADSHEET_ID must match the one in TL.html — the ID from
          the normal share/edit link (Share → Anyone with the link —
          Viewer), NOT a "Publish to web" link. See TL.html's config
          comment for exactly where to find it.
       2. Add one tab named exactly as INDEX_SHEET_NAME below. Give it
          these columns, in this exact order (any extra columns after
          Chapters are ignored):

            Title     - story title shown on the card
            Type      - "Event" or "Card" (case-insensitive). Controls
                        which column the story appears in AND which
                        folder/template its Cover number defaults to
                        (Event -> banner/, Card -> icons/). Anything
                        else is treated as "Event".
            Cover     - a plain number (e.g. "1") to auto-build the
                        filename from the template for this row's Type,
                        OR an explicit filename, OR a full URL
            Excerpt   - 1-2 sentence teaser
            Sheet     - the exact tab name TL.html should load
                        (this becomes the ?story= link)
            Chapters  - optional, e.g. "12 / 12" — shown as a meta line

          One row per story. Leave "Sheet" blank to hide a row (e.g.
          a story you're still adding).
       ============================================================ */
    const SPREADSHEET_ID = "1zDubus8G08u9BMxvCpepCU8Kiq0bTJNarsO0q5oLvDc";
    const INDEX_SHEET_NAME = "index";
    // Cover images can live in either folder, but the two folders use
    // different naming schemes (e.g. banner/event_banner_1.png vs
    // icons/card_icon_1.png). So "Cover" in the spreadsheet should just be
    // the number (e.g. "1") — we build the filename from the template that
    // matches this row's Type. "{n}" is replaced with the Cover value.
    const COVER_IMAGE_BASE = "./root/assets/banner/";
    const COVER_FILENAME_TEMPLATE = "event_banner_{n}.png";
    const COVER_IMAGE_FALLBACK_BASE = "./root/assets/icons/";
    const COVER_FALLBACK_FILENAME_TEMPLATE = "card_icon_{n}.png";

    function buildSheetCsvUrl(sheetTabName) {
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetTabName)}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const PLACEHOLDER_COVER = 'https://placehold.co/800x450/e8ddc4/8a7c68?text=Cover+coming+soon';

    // Returns { primary, fallback } — fallback is null when Cover is a full
    // URL (nothing sensible to fall back to) or empty.
    //
    // Cover column can be:
    //   - a plain number, e.g. "1"          -> uses the filename template
    //                                           for this row's Type
    //   - an explicit filename, e.g. "x.png" -> used as-is in both folders
    //   - a full http(s) URL                 -> used as-is, no fallback
    //
    // `type` is "event" or "card" (already lowercased). Event rows try the
    // banner folder first and fall back to icons; card rows do the reverse.
    function resolveCoverUrls(cover, type) {
      if (!cover) return { primary: PLACEHOLDER_COVER, fallback: null };
      if (/^https?:\/\//i.test(cover)) return { primary: cover, fallback: null };

      const isCard = type === 'card';
      const primaryBase = isCard ? COVER_IMAGE_FALLBACK_BASE : COVER_IMAGE_BASE;
      const fallbackBase = isCard ? COVER_IMAGE_BASE : COVER_IMAGE_FALLBACK_BASE;
      const primaryTemplate = isCard ? COVER_FALLBACK_FILENAME_TEMPLATE : COVER_FILENAME_TEMPLATE;
      const fallbackTemplate = isCard ? COVER_FILENAME_TEMPLATE : COVER_FALLBACK_FILENAME_TEMPLATE;

      if (/^\d+$/.test(cover)) {
        // Plain number: build filenames from the per-folder templates.
        return {
          primary: primaryBase + primaryTemplate.replace('{n}', cover),
          fallback: fallbackBase + fallbackTemplate.replace('{n}', cover),
        };
      }

      // Explicit filename given: use it as-is in both folders.
      return { primary: primaryBase + cover, fallback: fallbackBase + cover };
    }

    // Called when a cover <img> fails to load. Step 1: try the icons-folder
    // fallback (if one was set). Step 2: give up and show the placeholder.
    function handleCoverError(img) {
      const fallback = img.dataset.fallback;
      if (fallback) {
        img.dataset.fallback = ''; // don't loop if the fallback also 404s
        img.src = fallback;
      } else {
        img.onerror = null;
        img.src = PLACEHOLDER_COVER;
      }
    }

    function createCard(item) {
      const title = (item.Title || 'Untitled').trim();
      const excerpt = (item.Excerpt || '').trim();
      const sheet = (item.Sheet || '').trim();
      const chapters = (item.Chapters || '').trim();
      const { primary: coverUrl, fallback: coverFallbackUrl } = resolveCoverUrls((item.Cover || '').trim(), item.Type);

      const a = document.createElement('a');
      a.className = 'post-card';
      a.href = `./TL.html?story=${encodeURIComponent(sheet)}`;

      a.innerHTML = `
        <div class="post-cover-wrap">
          <img class="post-cover" src="${coverUrl}" alt="${escapeHtml(title)} cover"
               data-fallback="${coverFallbackUrl ? escapeHtml(coverFallbackUrl) : ''}"
               onerror="handleCoverError(this)">
        </div>
        ${chapters ? `<p class="post-meta">${escapeHtml(chapters)}</p>` : ''}
        <h2 class="post-title">${escapeHtml(title)}</h2>
        ${excerpt ? `<p class="post-excerpt">${escapeHtml(excerpt)}</p>` : ''}
        <span class="read-more">Read the translation &rarr;</span>
      `;
      return a;
    }

    async function loadFeed() {
      const statusEl = document.getElementById('feed-status');
      const columnsEl = document.getElementById('feed-columns');
      const eventsEl = document.getElementById('feed-events');
      const cardsEl = document.getElementById('feed-cards');

      try {
        const url = buildSheetCsvUrl(INDEX_SHEET_NAME);
        console.log('[DEBUG] Fetching:', url);

        const response = await fetch(url);
        console.log('[DEBUG] Response status:', response.status, response.ok);
        if (!response.ok) throw new Error('Could not reach the spreadsheet.');
        const csvText = await response.text();
        console.log('[DEBUG] Raw response (first 500 chars):', csvText.slice(0, 500));

        if (/^\s*<(!DOCTYPE|html)/i.test(csvText)) {
          throw new Error('The sheet returned a sign-in page instead of data. Double-check it\'s shared as "Anyone with the link — Viewer" (Share button, not Publish to web).');
        }

        // Parse WITHOUT relying on header names — some trailing empty
        // columns in this sheet are corrupting Papa's header row. We only
        // need the first 6 columns (Title, Type, Cover, Excerpt, Sheet,
        // Chapters) by fixed position, which sidesteps that entirely.
        const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
        console.log('[DEBUG] Parse errors:', parsed.errors);
        console.log('[DEBUG] Raw rows:', parsed.data);

        const dataRows = parsed.data.slice(1); // drop the header row
        const items = dataRows
          .map(cols => ({
            Title: (cols[0] || '').trim(),
            Type: (cols[1] || '').trim().toLowerCase(), // "event" or "card"
            Cover: (cols[2] || '').trim(),
            Excerpt: (cols[3] || '').trim(),
            Sheet: (cols[4] || '').trim(),
            Chapters: (cols[5] || '').trim(),
          }))
          .filter(row => row.Sheet !== '');
        console.log('[DEBUG] Items after filter:', items);

        if (items.length === 0) {
          statusEl.textContent = 'No stories published yet — check back soon.';
          statusEl.classList.remove('error');
          return;
        }

        const eventItems = items.filter(item => item.Type !== 'card');
        const cardItems = items.filter(item => item.Type === 'card');

        eventsEl.innerHTML = '';
        cardsEl.innerHTML = '';
        eventItems.forEach(item => eventsEl.appendChild(createCard(item)));
        cardItems.forEach(item => cardsEl.appendChild(createCard(item)));

        eventsEl.closest('section').style.display = eventItems.length ? '' : 'none';
        cardsEl.closest('section').style.display = cardItems.length ? '' : 'none';

        statusEl.style.display = 'none';
        columnsEl.style.display = 'grid';

      } catch (error) {
        console.error('Error loading feed:', error);
        statusEl.textContent = `Failed to load the story list. ${error.message}`;
        statusEl.classList.add('error');
      }
    }

    loadFeed();
  </script>
</body>
</html>
